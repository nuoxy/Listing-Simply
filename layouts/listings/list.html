{{ define "main" }}
{{- $active := where .Pages "Params.approved" true }}

<div class="page-list">
  <h1 class="page-title">כל המודעות</h1>

  <!-- Hugo's expiryDate excludes expired pages at build time -->
  {{- if $active }}
  <div class="listings-grid">
    {{- range sort $active "Date" "desc" }}
      {{ partial "listing-card.html" . }}
    {{- end }}
  </div>
  {{- else }}
  <div class="empty-state">
    <p class="empty-icon">📭</p>
    <p class="empty-title">אין מודעות פעילות</p>
    <a href="{{ "/submit/" | relURL }}" class="btn btn-primary">הגש מודעה</a>
  </div>
  {{- end }}
</div>
{{ end }}
