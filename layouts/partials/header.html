<header class="site-header">
  <div class="header-inner">
    <a href="{{ "/" | relURL }}" class="logo" aria-label="{{ .Site.Params.siteName }}">
      <span class="logo-icon">🍎</span>
      <span class="logo-text">{{ .Site.Params.siteName }}</span>
    </a>
    <div class="header-actions">
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="החלף בין מצב בהיר וכהה">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 1020.354 15.354z"/>
        </svg>
      </button>
      <a href="{{ "/submit/" | relURL }}" class="btn-post" aria-label="הוסף מודעה">
        <span>+ מודעה</span>
      </a>
    </div>
  </div>
</header>
