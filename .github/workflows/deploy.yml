name: Daily Listing Cleanup and Build

on:
  push:
    branches: [main]
  schedule:
    # Runs every day at midnight UTC (03:00 Israel time)
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write   # git commit/push expired deletions
  pages: write      # GitHub Pages deployment
  id-token: write   # GitHub Pages OIDC token

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # blueprint had typo: python-node-version

      - name: Delete Expired Listing Files
        run: |
          python -c "
          import os, re, datetime

          directory = 'content/listings'
          now = datetime.datetime.now(datetime.timezone.utc)

          if os.path.exists(directory):
              for filename in os.listdir(directory):
                  if filename.endswith('.md'):
                      filepath = os.path.join(directory, filename)
                      with open(filepath, 'r', encoding='utf-8') as f:
                          content = f.read()

                      match = re.search(r'expiryDate:\s*([0-9T:\-+Z]+)', content)
                      if match:
                          try:
                              expiry_str = match.group(1).split('+')[0].split('Z')[0]
                              expiry_date = datetime.datetime.fromisoformat(expiry_str).replace(tzinfo=datetime.timezone.utc)
                              if now > expiry_date:
                                  os.remove(filepath)
                                  print(f'Deleted expired listing: {filename}')
                          except Exception as e:
                              print(f'Error parsing {filename}: {e}')
          "

      - name: Commit Deleted Expired Files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add content/listings/
          git diff --quiet && git diff --staged --quiet || \
            (git commit -m "Automated cleanup of expired listings" && git push)

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.126.0"
          extended: false

      - name: Build Static Site
        run: hugo --gc --minify

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
